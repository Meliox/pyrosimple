---
name: Release

"on":
  workflow_dispatch:
    inputs:
      version:
        description: >-
          New version (e.g. 3.0.0, the first release of this fork),
          or one of: major, minor, patch
        required: true
        type: string

permissions:
  contents: write

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Validate version input
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "${VERSION}" =~ ^([0-9]+\.[0-9]+\.[0-9]+|major|minor|patch)$ ]]; then
            echo "::error::Invalid version '${VERSION}'"
            exit 1
          fi
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install poetry
        run: pip install poetry
      - name: Bump version, update changelog and build
        env:
          VERSION: ${{ inputs.version }}
        run: ./version.sh "${VERSION}"
      - name: Check release notes
        run: |
          if ! grep -q '[^[:space:]]' RELEASE_NOTE.md; then
            echo "::error::The [Unreleased] section of CHANGELOG.md is empty"
            exit 1
          fi
      - name: Commit and tag
        run: |
          version="$(poetry version -s --no-ansi)"
          if git rev-parse -q --verify "refs/tags/v${version}" > /dev/null; then
            echo "::error::Tag v${version} already exists"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml CHANGELOG.md
          git commit -m "Release v${version}"
          git tag "v${version}"
          git push origin HEAD:main "v${version}"
          echo "VERSION=${version}" >> "${GITHUB_ENV}"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${VERSION}" dist/* \
            --title "v${VERSION}" \
            --notes-file RELEASE_NOTE.md \
            --verify-tag
